      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Microlins — Painel de Desempenho & Exportação Acadêmica",
        "description": "Painel analítico e exportador inteligente de dados de desempenho acadêmico, frequência e notas da unidade Microlins Presidente Prudente.",

        "operatingSystem": "Web",

          "name": "Grupo Realizar Microlins"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('microlins_theme_preference');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldUseDark = saved ? saved === 'dark' : prefersDark;
          if (shouldUseDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
